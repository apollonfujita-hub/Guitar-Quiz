<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ギター知識ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef3f5;
    --surface: #ffffff;
    --text: #1c2b33;
    --text-dim: #64767f;
    --orange: #ff7e00;
    --amber: #ffa810;
    --blue: #1a5ca0;
    --teal: #27a5b8;
    --wrong: #d9534f;
    --shadow: rgba(26,92,160,0.14);
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #ffffff 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height:100vh;
    display:flex; justify-content:center;
    padding: 18px 12px 40px;
  }
  #app{ width:100%; max-width: 460px; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--orange); opacity:0.95;
  }
  .plate{
    background: linear-gradient(160deg, var(--blue), var(--teal) 120%);
    border-radius: var(--radius); padding: 22px 20px 20px; position: relative;
    box-shadow: 0 10px 26px var(--shadow), inset 0 0 0 1px rgba(255,255,255,0.15);
    overflow:hidden;
  }
  .plate::before{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 6px);
    pointer-events:none;
  }
  .plate .eyebrow{ color: var(--amber); }
  .corner{ position:absolute; width:16px; height:16px; border: 2px solid rgba(255,255,255,0.55); opacity:0.8; }
  .corner.tl{top:8px; left:8px; border-right:none; border-bottom:none;}
  .corner.tr{top:8px; right:8px; border-left:none; border-bottom:none;}
  .corner.bl{bottom:8px; left:8px; border-right:none; border-top:none;}
  .corner.br{bottom:8px; right:8px; border-left:none; border-top:none;}
  .plate h1{ font-size: 24px; color: #ffffff; letter-spacing:0.01em; margin-top:4px; padding-right:70px;}
  .plate .sub{ color: rgba(255,255,255,0.85); font-size: 13px; margin-top:4px;}

  .strings{ margin-top:18px; display:flex; flex-direction:column; gap:9px; }
  .string-row{ display:flex; align-items:center; gap:10px; }
  .string-label{
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; color: rgba(255,255,255,0.75);
    width: 74px; flex-shrink:0; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .string-track{ position:relative; flex:1; height:3px; border-radius:2px; background: rgba(255,255,255,0.25); }
  .string-fill{
    position:absolute; top:-1.5px; left:0; height:6px; border-radius:3px;
    background: linear-gradient(90deg, var(--orange), var(--amber));
    box-shadow: 0 0 8px rgba(255,168,16,0.55);
    transition: width 0.6s cubic-bezier(.2,.8,.2,1);
  }
  .string-pct{ font-family:'JetBrains Mono', monospace; font-size:11px; color:#ffffff; width: 34px; text-align:right; flex-shrink:0; }

  .btn{
    font-family:'DM Sans', sans-serif; font-weight:700; font-size:15px;
    border:none; border-radius: 10px; padding: 15px 18px;
    cursor:pointer; width:100%; text-align:center;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{
    background: linear-gradient(180deg, var(--orange), var(--amber));
    color: #ffffff; box-shadow: 0 6px 16px rgba(255,126,0,0.32);
  }
  .btn-ghost{ background: transparent; color: var(--blue); border: 1px solid rgba(26,92,160,0.35); }
  .btn-ghost:hover{ background: rgba(26,92,160,0.06); }
  .btn-row{ display:flex; gap:10px; margin-top:10px; }
  .btn-sm{ padding: 10px 14px; font-size:13px; }

  .card{
    background: var(--surface); border: 1px solid rgba(26,44,51,0.08);
    border-radius: var(--radius); padding: 18px; margin-top: 14px;
    box-shadow: 0 2px 10px rgba(26,44,51,0.04);
  }
  .level-card{
    background: var(--surface); border: 1px solid rgba(26,44,51,0.08);
    border-radius: var(--radius); padding: 16px 18px; margin-top: 12px;
    box-shadow: 0 2px 10px rgba(26,44,51,0.04);
  }
  .level-head{ display:flex; align-items:center; justify-content:space-between; }
  .level-name{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; color: var(--text); }
  .level-tag{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color: var(--orange); text-transform:uppercase; letter-spacing:0.08em;}
  .level-desc{ color: var(--text-dim); font-size:12.5px; margin-top:2px;}
  .level-meta{ font-size:12px; color: var(--text-dim); margin: 10px 0 12px; display:flex; gap:14px; flex-wrap:wrap;}
  .level-meta b{ color: var(--blue); font-family:'JetBrains Mono', monospace; }

  .stat-grid{ display:flex; gap:10px; margin-top:12px; }
  .stat{ flex:1; background: rgba(26,92,160,0.06); border-radius: 10px; padding: 12px 10px; text-align:center; border: 1px solid rgba(26,92,160,0.1); }
  .stat .num{ font-family:'JetBrains Mono', monospace; font-size: 20px; color: var(--blue); font-weight:700; }
  .stat .lbl{ font-size: 10.5px; color: var(--text-dim); margin-top:3px; }

  .section-title{ font-size: 13px; color: var(--text-dim); margin: 20px 0 8px 2px; letter-spacing:0.03em; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .link-btn{ background:none; border:none; color: var(--text-dim); font-family:'DM Sans'; font-size:13px; cursor:pointer; padding:6px 2px; }
  .link-btn:hover{ color: var(--text); }
  .progress-bar{ height:5px; border-radius:3px; background:rgba(26,44,51,0.08); overflow:hidden; margin-bottom:18px;}
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--orange), var(--amber)); transition: width 0.4s ease;}
  .q-cat{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--orange); text-transform:uppercase; letter-spacing:0.1em;}
  .q-type{ font-size:11px; color: var(--text-dim); }
  .q-text{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; line-height:1.45; margin: 10px 0 18px; color: var(--text);}
  .choice{
    display:block; width:100%; text-align:left;
    background: var(--surface); border: 1px solid rgba(26,44,51,0.14); color: var(--text);
    border-radius: 10px; padding: 13px 14px; margin-bottom:10px;
    font-family:'DM Sans'; font-size:14.5px; cursor:pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .choice:hover{ background: rgba(26,92,160,0.05); }
  .choice.selected-correct{ border-color: var(--teal); background: rgba(39,165,184,0.14); }
  .choice.selected-wrong{ border-color: var(--wrong); background: rgba(217,83,79,0.10); }
  .choice.reveal-correct{ border-color: var(--teal); }
  .choice[disabled]{ cursor:default; }
  .fill-input{
    width:100%; padding:13px 14px; border-radius:10px;
    background: var(--surface); border:1px solid rgba(26,44,51,0.18);
    color: var(--text); font-family:'DM Sans'; font-size:15px; margin-bottom:12px;
  }
  .fill-input:focus{ outline:none; border-color: var(--orange); }
  .feedback{ margin-top: 4px; padding: 12px 14px; border-radius:10px; font-size:13.5px; line-height:1.5; }
  .feedback.ok{ background: rgba(39,165,184,0.12); color: #1d7a87; border:1px solid rgba(39,165,184,0.35);}
  .feedback.ng{ background: rgba(217,83,79,0.10); color: #b23b37; border:1px solid rgba(217,83,79,0.35);}

  .score-hero{ text-align:center; padding: 10px 0 4px; }
  .score-num{ font-family:'JetBrains Mono', monospace; font-size:52px; font-weight:700; color: #ffffff; line-height:1; }
  .score-label{ color: rgba(255,255,255,0.85); font-size:13px; margin-top:6px; }
  .review-item{ border-top: 1px solid rgba(26,44,51,0.08); padding: 12px 2px; font-size:13.5px; }
  .review-item .rq{ color: var(--text); margin-bottom:4px; }
  .review-item .ra{ color: var(--text-dim); }
  .tag-ok{ color: var(--teal); }
  .tag-ng{ color: var(--wrong); }

  .hist-item{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--surface); border:1px solid rgba(26,44,51,0.08);
    border-radius:10px; padding:13px 14px; margin-top:9px; cursor:pointer;
    box-shadow: 0 2px 8px rgba(26,44,51,0.04);
  }
  .hist-item:hover{ background: rgba(26,92,160,0.05); }
  .hist-date{ font-size:12.5px; color: var(--text-dim); }
  .hist-sub{ font-size:11px; color: var(--orange); font-family:'JetBrains Mono', monospace; margin-top:2px;}
  .hist-score{ font-family:'JetBrains Mono', monospace; color: var(--blue); font-weight:700; }
  .empty{ text-align:center; color: var(--text-dim); font-size:13.5px; padding: 30px 10px; }
  .loading{ text-align:center; color: var(--text-dim); padding: 60px 10px; font-size:13px; }
  .note{ font-size:11.5px; color: var(--text-dim); margin-top:10px; line-height:1.5; }
  .brand-logo-img{ position:absolute; top:14px; right:14px; width:60px; height:auto; display:block; background:#ffffff; padding:4px 6px; border-radius:8px; box-shadow: 0 3px 10px rgba(0,0,0,0.18); z-index:2; }
  .admin-link-row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid rgba(26,44,51,0.08); }
  .whoami{ font-size:12px; color: var(--text-dim); }
  .admin-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid rgba(26,44,51,0.06); }
  .admin-row:last-child{ border-bottom:none; }
  .admin-rank{ font-family:'JetBrains Mono', monospace; font-weight:700; color: var(--text-dim); width:20px; flex-shrink:0; }
  .admin-info{ flex:1; min-width:0; }
  .admin-name{ font-weight:700; color: var(--text); font-size:14px; }
  .admin-sub{ font-size:11.5px; color: var(--text-dim); margin-top:2px; }
  .admin-levels{ display:flex; gap:12px; flex-wrap:wrap; margin-top:5px; font-size:11px; color: var(--text-dim); }
  .admin-levels b{ color: var(--text); font-family:'JetBrains Mono', monospace; font-weight:700; }
  .admin-pct{ font-family:'JetBrains Mono', monospace; font-weight:700; color: var(--blue); font-size:16px; flex-shrink:0; }
  .field-label{ font-size:12px; color: var(--text-dim); margin-bottom:8px; font-weight:700; }
  .store-grid{ display:flex; flex-direction:column; gap:8px; }
  .store-btn{
    text-align:left; padding:12px 14px; border-radius:10px;
    background: var(--surface); border:1px solid rgba(26,44,51,0.15); color: var(--text);
    font-family:'DM Sans'; font-size:14.5px; cursor:pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .store-btn:hover{ background: rgba(26,92,160,0.05); }
  .store-btn.selected{ border-color: var(--blue); background: rgba(26,92,160,0.1); font-weight:700; color: var(--blue); }
  .store-heading{ font-family:'Fraunces', serif; font-weight:600; font-size:15px; color: var(--text); padding:14px 16px 4px; }
  .store-heading .store-sub{ font-family:'DM Sans'; font-weight:400; font-size:11.5px; color: var(--text-dim); margin-left:8px; }
</style>
</head>
<body>
<div id="app"><div class="loading">開いています…</div></div>


<script>
/* ============================= 問題データベース(ギター特化) ============================= */
/* レベルごとに配列順=出題順。ここに追記していけば自動的に150問まで拡張できます。 */
const QUESTIONS = {
  '初級': [
    {id:'b1', type:'mc', q:'エレキギターの弦は何本が標準?', options:['4本','5本','6本','7本'], answer:'6本', exp:'エレキ・アコースティックともに標準は6本です。'},
    {id:'b2', type:'mc', q:'アコースティックギターの弦は何本が標準?', options:['4本','6本','8本','12本'], answer:'6本', exp:'12弦モデルなどもありますが、標準は6本です。'},
    {id:'b3', type:'tf', q:'エレキギターは単体ではほとんど音が出ないため、通常アンプに接続して音を出す。', answer:true, exp:'エレキギターの生音は小さく、実用的にはアンプで増幅します。'},
    {id:'b4', type:'tf', q:'アコースティックギターは電気を使わなくてもボディの共鳴だけで演奏できる。', answer:true, exp:'弦の振動をボディ内部で共鳴・増幅させる構造だからです。'},
    {id:'b5', type:'fill', q:'弦を巻いて音程を調整する、ヘッド部分にある部品を何という?', accept:['ペグ','チューニングペグ','糸巻き','peg','tuning peg','machine head'], exp:'「ペグ(チューニングペグ)」で弦の張力=音程を調整します。'},
    {id:'b6', type:'mc', q:'指板上にあり、押さえる位置で音程を区切る金属の帯を何という?', options:['ナット','フレット','ブリッジ','サドル'], answer:'フレット', exp:'押さえるフレット位置によって音程が決まります。'},
    {id:'b7', type:'mc', q:'弦の一端を固定し、ボディに振動を伝える部品は?', options:['ペグ','ナット','ブリッジ','ピックガード'], answer:'ブリッジ', exp:'ブリッジは弦の張力を受け止め、振動をボディに伝える重要な部品です。'},
    {id:'b8', type:'fill', q:'ギターの一番太い6弦(開放弦)の音名は?', accept:['E'], exp:'標準チューニングでは6弦から順に E-A-D-G-B-E です。'},
    {id:'b9', type:'mc', q:'エレキギターで、弦の振動を電気信号に変える部品は?', options:['マイク','ピックアップ','スピーカー','アンプ'], answer:'ピックアップ', exp:'ピックアップが弦の振動を電気信号に変換し、アンプで増幅します。'},
    {id:'b10', type:'tf', q:'クラシックギターとアコースティック(フォーク)ギターは同じ種類の弦を使う。', answer:false, exp:'クラシックはナイロン弦、アコースティックは主にスチール(またはブロンズ系)弦です。'},
    {id:'b11', type:'mc', q:'指で弾く代わりに使う、弦をはじくための道具は?', options:['カポ','ピック','ペグ','ノブ'], answer:'ピック', exp:'「ピック(プレクトラム)」は弦を弾くための道具です。'},
    {id:'b12', type:'tf', q:'カポタストは音程を下げるための道具である。', answer:false, exp:'カポは弦を締めて音程を「上げる」ための道具で、キー変更に使います。'},
    {id:'b13', type:'mc', q:'ギターのボリュームや音色を調整するツマミの名称は?', options:['ノブ','ペグ','フレット','ブリッジ'], answer:'ノブ', exp:'ボリューム・トーンなどの調整ツマミを「ノブ」と呼びます。'},
    {id:'b14', type:'fill', q:'弦の太さのことを何と呼ぶ?', accept:['ゲージ','gauge'], exp:'弦の太さは「ゲージ」で表され、数値が大きいほど太くなります。'},
    {id:'b15', type:'tf', q:'エレキギターのボディは基本的に空洞ではなく木材の塊(ソリッド)が主流である。', answer:true, exp:'ソリッドボディが主流で、ハウリングに強くサステインが長い特徴があります。'},
    {id:'b16', type:'mc', q:'アコースティックギターの表面にある丸い穴を何という?', options:['サウンドホール','ピックホール','エアホール','レゾナンスホール'], answer:'サウンドホール', exp:'サウンドホールから音が放出され、ボディ内部の共鳴を活かします。'},
    {id:'b17', type:'mc', q:'ギターを肩にかけて立って弾くための帯は?', options:['ベルト','ストラップ','サドル','スリング'], answer:'ストラップ', exp:'「ストラップ」を使うと立奏や座奏で安定して構えられます。'},
    {id:'b18', type:'tf', q:'弦は使っているうちに劣化するので、定期的な交換が必要である。', answer:true, exp:'錆・伸び・音のこもりが出るため、演奏頻度に応じた交換が推奨されます。'},
    {id:'b19', type:'fill', q:'弦とネックの境目にあり、弦の間隔を支える溝付きの部品は?', accept:['ナット','nut'], exp:'「ナット」がヘッド側で弦の間隔と高さの基準を作ります。'},
    {id:'b20', type:'mc', q:'ギター本体を保護して持ち運ぶための箱状の道具は?', options:['ケース','ラック','スタンド','フック'], answer:'ケース', exp:'ハードケースやソフトケース(ギグバッグ)で持ち運び・保管します。'},
    {id:'b21', type:'tf', q:'エレキギターとアコースティックギターでは、必要な周辺機材(アンプ等)が異なる。', answer:true, exp:'エレキは基本的にアンプが必要ですが、アコースティックは不要です。'},
    {id:'b22', type:'mc', q:'一般的なギターのチューニング(標準)で、最も低い6弦の音は?', options:['E','A','G','C'], answer:'E', exp:'標準チューニングは低い方からE-A-D-G-B-Eです。'},
    {id:'b23', type:'mc', q:'エレキギターをアンプにつなぐ際に使うケーブルの接続部分を何という?', options:['シールドジャック','USBポート','HDMI端子','電源プラグ'], answer:'シールドジャック', exp:'いわゆる「シールド(ケーブル)」を挿す1/4インチジャックです。'},
    {id:'b24', type:'tf', q:'弾いた後に弦の汗や汚れを拭き取ると、弦が長持ちする。', answer:true, exp:'皮脂や汗は弦の劣化・サビの原因になるため、拭き取りが有効です。'},
    {id:'b25', type:'fill', q:'ギター本体の、弦を張るために首のように伸びる細長い部分を何という?', accept:['ネック','neck'], exp:'「ネック」にフレットや指板が取り付けられています。'},
    {id:'b26', type:'mc', q:'弦を押さえて音程を作る、ネック表面の板状の部分は?', options:['指板','ヘッド','ブリッジ','ボディトップ'], answer:'指板', exp:'「指板(フィンガーボード)」の上にフレットが並びます。'},
    {id:'b27', type:'tf', q:'アコースティックギターは湿度の変化に弱く、保管環境に注意が必要である。', answer:true, exp:'木材が湿度で膨張・収縮するため、割れや反りにつながることがあります。'},
    {id:'b28', type:'mc', q:'複数のピックアップを切り替えるためのスイッチを何という?', options:['トーンスイッチ','ピックアップセレクター','キルスイッチ','マスタースイッチ'], answer:'ピックアップセレクター', exp:'ネック側・ブリッジ側などピックアップの組み合わせを切り替えます。'},
    {id:'b29', type:'fill', q:'ギター本体で最も面積が大きい、共鳴・演奏の基盤となる部分を何という?', accept:['ボディ','body'], exp:'「ボディ」は音質や重さ、デザインにも大きく関わる部分です。'},
    {id:'b30', type:'tf', q:'一般的なギターの1弦(一番細い弦)は、6弦より高い音が出る。', answer:true, exp:'6弦が最低音、1弦が最高音になるように張られています。'},
    {id:'b31', type:'mc', q:'弦交換や各部の調整をまとめて行うメンテナンス作業を何という?', options:['セットアップ','リペア','リフレット','チューニング'], answer:'セットアップ', exp:'弦高・オクターブ調整などをまとめて行う作業を「セットアップ」と呼びます。'},
    {id:'b32', type:'mc', q:'ピックには厚み(硬さ)の違いがあり、主に何と呼ばれる基準で選ぶ?', options:['厚さ(ミリ数)','重さ(グラム)','長さ(センチ)','幅(インチ)'], answer:'厚さ(ミリ数)', exp:'薄い・普通・厚いなど、ミリ数表記で弾き心地や音の硬さが変わります。'},
    {id:'b33', type:'tf', q:'初心者用ギターは、価格だけでなく「押さえやすさ」も選ぶ基準になる。', answer:true, exp:'弦高や弦のテンションが高すぎると挫折しやすいため重要な観点です。'},
    {id:'b34', type:'fill', q:'アンプを使わなくても生音が出て、かつピックアップも搭載されたアコースティックギターを俗に何という?', accept:['エレアコ','acoustic-electric','acoustic electric','electric acoustic'], exp:'「エレアコ(エレクトリック・アコースティックギター)」はライブなどでPA接続もできます。'},

/* =====================================================================
   保存の仕組み(Claudeアカウント不要・無料)
   - 個人データ(名前・店舗・自分の進捗) → ブラウザのlocalStorage
   - 共有データ(店長が見る全員の成績)   → Google Apps Script(無料)経由でGoogleスプレッドシートに保存
   BACKEND_URL は、店長側でGoogle Apps Scriptを公開した後に発行されるURLに書き換えてください。
   セットアップ手順は会話内の案内を参照してください。
===================================================================== */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycby6DixkGm_8rBlPwDHz84XiXXP8MxHUHdgOytD5EmiDx6lNu0LTRTz5tD-fJwJt7QPVDA/exec';
const backendConfigured = () => BACKEND_URL && BACKEND_URL.indexOf('https://script.google.com/') === 0;
let backendError = null; // 共有保存で直近に発生したエラー(表示用)

const appStorage = {
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem(key);
      if(v === null) throw new Error('not found: ' + key);
      return { key, value: v, shared };
    }
    if(!backendConfigured()) throw new Error('BACKEND_URL が未設定です');
    const res = await fetch(`${BACKEND_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('Storage get failed: HTTP ' + res.status);
    const data = await res.json();
    if(!data.found) throw new Error('not found: ' + key);
    return { key, value: data.value, shared };
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem(key, value);
      return { key, value, shared };
    }
    if(!backendConfigured()) throw new Error('BACKEND_URL が未設定です');
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Apps ScriptのCORSプリフライト回避のためtext/plainで送る
      body: JSON.stringify({ action:'set', key, value })
    });
    if(!res.ok) throw new Error('Storage set failed: HTTP ' + res.status);
    return { key, value, shared };
  },
  async delete(key, shared){
    if(!shared){
      localStorage.removeItem(key);
      return { key, deleted:true, shared };
    }
    if(!backendConfigured()) throw new Error('BACKEND_URL が未設定です');
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'delete', key })
    });
    if(!res.ok) throw new Error('Storage delete failed: HTTP ' + res.status);
    return { key, deleted:true, shared };
  },
  async list(prefix, shared){
    if(!shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(!prefix || k.indexOf(prefix)===0) keys.push(k); }
      return { keys, prefix, shared };
    }
    if(!backendConfigured()) throw new Error('BACKEND_URL が未設定です');
    const res = await fetch(`${BACKEND_URL}?action=list&prefix=${encodeURIComponent(prefix||'')}`);
    if(!res.ok) throw new Error('Storage list failed: HTTP ' + res.status);
    const data = await res.json();
    return { keys: data.keys||[], prefix, shared };
  }
};

function employeeKey(){ return `${employeeStore}::${employeeName}`; }

async function loadData(){
  try{
    const nameRes = await appStorage.get(NAME_KEY, false);
    if(nameRes && nameRes.value){ employeeName = nameRes.value; }
  }catch(e){ /* 未登録 */ }
  try{
    const storeRes = await appStorage.get(STORE_KEY, false);
    if(storeRes && storeRes.value){ employeeStore = storeRes.value; }
  }catch(e){ /* 未登録 */ }
  try{
    const res = await appStorage.get(STORAGE_KEY, false);
    if(res && res.value){ DATA = JSON.parse(res.value); }
  }catch(e){ /* 初回はキーが無い */ }
  if(!DATA.sessions) DATA.sessions = [];
  if(!DATA.progress) DATA.progress = {};
  if(!DATA.maxReached) DATA.maxReached = {};
  LEVELS.forEach(l => {
    if(typeof DATA.progress[l] !== 'number') DATA.progress[l] = 0;
    if(typeof DATA.maxReached[l] !== 'number') DATA.maxReached[l] = 0;
  });
  screen = (employeeName && employeeStore) ? 'home' : 'nameGate';
  render();
}

async function saveEmployeeProfile(name){
  if(!pendingStore){ nameInputError = '店舗を選択してください'; render(); return; }
  const trimmed = name.trim();
  if(trimmed.length === 0){ nameInputError = '名前を入力してください'; render(); return; }
  if(trimmed.length > 20){ nameInputError = '20文字以内で入力してください'; render(); return; }
  employeeStore = pendingStore;
  employeeName = trimmed;
  try{ await appStorage.set(STORE_KEY, employeeStore, false); }
  catch(e){ console.error('店舗の保存に失敗しました', e); }
  try{ await appStorage.set(NAME_KEY, employeeName, false); }
  catch(e){ console.error('名前の保存に失敗しました', e); }
  screen = 'home';
  render();
}

/* ============================= 管理者ダッシュボード ============================= */
async function loadAdminDashboard(){
  adminError = '';
  adminEmployees = null;
  adminFailedCount = 0;
  screen = 'adminDashboard';
  render();
  try{
    let keys = [];
    try{
      const listRes = await appStorage.list(EMPLOYEE_PREFIX, true);
      keys = (listRes && listRes.keys) ? listRes.keys : [];
    }catch(e){ /* まだ誰も挑戦していない、またはlist失敗 */ }

    const employees = [];
    const failed = [];
    for(const key of keys){
      const rest = key.slice(EMPLOYEE_PREFIX.length); // "店舗::名前"
      const sep = rest.indexOf('::');
      if(sep === -1) continue;
      const store = rest.slice(0, sep);
      const name = rest.slice(sep + 2);
      let ok = false;
      for(let attempt=0; attempt<2 && !ok; attempt++){ // 通信エラー対策で1回だけ自動リトライ
        try{
          const res = await appStorage.get(key, true);
          if(res && res.value){
            const d = JSON.parse(res.value);
            employees.push({ store, name, data: d });
            ok = true;
          }
        }catch(e){
          if(attempt === 1){ failed.push(name); console.error('読み込み失敗:', store, name, e); }
        }
      }
    }
    adminEmployees = employees;
    adminFailedCount = failed.length;
  }catch(e){
    console.error('管理者データの読み込みエラー', e);
    adminError = '読み込みに失敗しました(' + (e && e.message ? e.message : '不明なエラー') + ')。もう一度お試しください。';
  }
  render();
}

/* ============================= 集計ヘルパー =============================
   正答率は「各問題ごとの一番新しい回答」だけを使って計算する。
   同じ問題を解き直して正解すれば、その問題は「正解」として扱われる(過去の間違いは上書きされる)。
*/
function latestAnswerMap(sessions, levelFilter){
  // sessions は新しい順(unshift)で並んでいる前提。先に出てきた方を「最新」として採用する。
  const map = new Map();
  (sessions||[]).forEach(s=>{
    (s.answers||[]).forEach(a=>{
      const lvl = a.trueLevel || a.level; // 旧データ(trueLevel未保存)との互換用フォールバック
      if(levelFilter && lvl !== levelFilter) return;
      if(!map.has(a.qId)) map.set(a.qId, a);
    });
  });
  return map;
}
function statsFromMap(map){
  let correct=0, total=0;
  map.forEach(a=>{ total++; if(a.correct) correct++; });
  return { correct, total, pct: total? Math.round(correct/total*100) : 0 };
}

function employeeOverallStats(d){
  const map = latestAnswerMap(d.sessions, null);
  const s = statsFromMap(map);
  return { ...s, sessions: (d.sessions||[]).length };
}
function employeeLastActive(d){
  if(!d.sessions || d.sessions.length===0) return null;
  return d.sessions[0].date; // sessions は unshift で新しい順
}
/* 指定した従業員データ(d)の、指定レベルの「直近の正答率」と「到達度」をまとめて返す */
function employeeLevelStats(d, level){
  const s = statsFromMap(latestAnswerMap(d.sessions, level));
  const poolSize = QUESTIONS[level].length;
  const reached = (d.maxReached && typeof d.maxReached[level]==='number') ? Math.min(d.maxReached[level], poolSize) : 0;
  return { ...s, reached, poolSize };
}

function levelStats(level){ return employeeLevelStats(DATA, level); }
function overallStats(){ return employeeOverallStats(DATA); }

function currentStreak(){
  if(DATA.sessions.length === 0) return 0;
  const days = [...new Set(DATA.sessions.map(s => s.date.slice(0,10)))].sort().reverse();
  let streak = 0;
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  for(let i=0;i<days.length;i++){
    const d = new Date(days[i]+'T00:00:00');
    const diff = Math.round((cursor - d) / 86400000);
    if(diff === streak){ streak++; }
    else if(diff === streak + 1 && streak === 0){ streak++; }
    else break;
  }
  return streak;
}
function fmtDate(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ============================= クイズロジック(順番進行・10問ずつ・一周したら最初へ) ============================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function findQuestionById(qId){
  for(const lv of LEVELS){
    const q = QUESTIONS[lv].find(qq=>qq.id===qId);
    if(q) return { question:q, level:lv };
  }
  return null;
}

/* 過去に間違えた問題をユニークに集める(直近の間違いを優先) */
function getWrongQuestions(){
  const map = latestAnswerMap(DATA.sessions, null); // qId -> 最新の回答
  const list = [];
  map.forEach(a=>{
    if(!a.correct){
      const found = findQuestionById(a.qId);
      if(found) list.push({ ...found.question, trueLevel: found.level });
    }
  });
  return list;
}

function startQuiz(level){
  const pool = QUESTIONS[level];
  const start = DATA.progress[level] % pool.length;
  const size = Math.min(SESSION_SIZE, pool.length);
  let picked = [];
  for(let i=0;i<size;i++){ picked.push({ ...pool[(start+i) % pool.length], trueLevel: level }); }
  currentQuiz = { level, pool, start, questions: picked, index: 0, answers: [], locked:false, selected:null, mode:'progress' };
  screen = 'quiz';
  render();
}

/* レベル内の全問題からランダムに10問。進捗には影響しない */
function startRandomQuiz(level){
  const pool = QUESTIONS[level];
  const picked = shuffle(pool).slice(0, Math.min(SESSION_SIZE, pool.length)).map(q=>({ ...q, trueLevel: level }));
  currentQuiz = { level, pool, start:null, questions: picked, index:0, answers:[], locked:false, selected:null, mode:'random' };
  screen = 'quiz';
  render();
}

/* 今までの間違い問題だけを集めた復習モード。進捗には影響しない */
function startReviewMode(){
  const wrongQuestions = getWrongQuestions(); // {question, level} 済みのtrueLevel付き
  if(wrongQuestions.length === 0) return;
  const picked = wrongQuestions.slice(0, Math.min(SESSION_SIZE, wrongQuestions.length));
  currentQuiz = { level:'復習', pool: wrongQuestions, start:null, questions: picked, index:0, answers:[], locked:false, selected:null, mode:'review' };
  screen = 'quiz';
  render();
}

/* 履歴にある過去のセットを、同じ問題構成でもう一度。進捗には影響しない */
function startReplaySession(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  const questions = s.answers.map(a=>{
    const found = findQuestionById(a.qId);
    return found ? { ...found.question, trueLevel: found.level } : null;
  }).filter(Boolean);
  if(questions.length === 0) return;
  currentQuiz = { level:s.level, pool:questions, start:null, questions, index:0, answers:[], locked:false, selected:null, mode:'replay', replayOf:s.id };
  screen = 'quiz';
  render();
}

function submitAnswer(userValue){
  const q = currentQuiz.questions[currentQuiz.index];
  let correct = false;
  if(q.type === 'mc'){ correct = (userValue === q.answer); }
  else if(q.type === 'tf'){ correct = (userValue === q.answer); }
  else if(q.type === 'fill'){
    const toHalfWidth = s => String(s).replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' ');
    const norm = s => toHalfWidth(s).trim().toLowerCase().replace(/[\s\-‐-‑–—_]/g, '');
    correct = q.accept.some(a => {
      const nu = norm(userValue), na = norm(a);
      return nu.length>0 && (nu.includes(na) || na.includes(nu));
    });
  }
  currentQuiz.locked = true;
  currentQuiz.selected = userValue;
  currentQuiz.answers.push({
    qId:q.id, level: currentQuiz.level, trueLevel: q.trueLevel || currentQuiz.level, type:q.type, question:q.q,
    userAnswer:userValue, correctAnswer:(q.type==='fill'?q.accept[0]:q.answer), correct, exp:q.exp
  });
  render();
}

function nextQuestion(){
  if(currentQuiz.index < currentQuiz.questions.length - 1){
    currentQuiz.index++; currentQuiz.locked = false; currentQuiz.selected = null;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  const { level, pool, start, questions, answers, mode, replayOf } = currentQuiz;
  const score = answers.filter(a=>a.correct).length;
  const isProgress = (mode === 'progress' || !mode);
  const session = {
    id: 'sess_'+Date.now(), date: new Date().toISOString(), level,
    mode: mode || 'progress',
    replayOf: replayOf || null,
    rangeStart: isProgress ? start+1 : null,
    rangeEnd: isProgress ? start+questions.length : null,
    score, total: answers.length, answers
  };
  DATA.sessions.unshift(session);
  if(isProgress){
    DATA.progress[level] = (start + questions.length) % pool.length;
    const reachedEnd = Math.min(start + questions.length, pool.length);
    if(!DATA.maxReached) DATA.maxReached = {};
    DATA.maxReached[level] = Math.max(DATA.maxReached[level] || 0, reachedEnd);
  }
  saveData();
  screen = 'result';
  render();
}

function exitQuiz(){ currentQuiz = null; screen = 'home'; render(); }

/* セッションの表示ラベルと「続き」ボタンの挙動をモードごとに切り替える */
function sessionLabel(s){
  if(s.mode === 'random') return `${s.level}・ランダム${s.total}問`;
  if(s.mode === 'review') return `復習(苦手問題)・${s.total}問`;
  if(s.mode === 'replay') return `${s.level}・再挑戦(${s.total}問)`;
  return `${s.level}・${s.rangeStart}〜${s.rangeEnd}問目`;
}
function continueButtonLabel(s){
  if(s.mode === 'random') return 'もう一度ランダム10問';
  if(s.mode === 'review') return 'もう一度復習する';
  if(s.mode === 'replay') return '同じ問題をもう一度';
  return `続きの${s.total}問へ`;
}
function continueSession(){
  const s = DATA.sessions[0];
  if(s.mode === 'random') startRandomQuiz(s.level);
  else if(s.mode === 'review') startReviewMode();
  else if(s.mode === 'replay') startReplaySession(s.replayOf || s.id);
  else startQuiz(s.level);
}

function renderQuiz(){
  const { questions, index, locked, answers, level } = currentQuiz;
  const q = questions[index];
  const progressPct = Math.round((index/(questions.length))*100);
  let bodyHtml = '';

  if(q.type === 'mc'){
    bodyHtml = q.options.map(opt=>{
      let cls = 'choice';
      if(locked){
        if(opt === q.answer) cls += ' reveal-correct';
        if(opt === currentQuiz.selected && opt !== q.answer) cls += ' selected-wrong';
        if(opt === currentQuiz.selected && opt === q.answer) cls += ' selected-correct';
      }
      return `<button class="${cls}" data-opt="${escapeHtml(opt)}" ${locked?'disabled':''}>${escapeHtml(opt)}</button>`;
    }).join('');
  } else if(q.type === 'tf'){
    const opts = [ {label:'○ 正しい', val:true}, {label:'× 誤り', val:false} ];
    bodyHtml = opts.map(o=>{
      let cls = 'choice';
      if(locked){
        if(o.val === q.answer) cls += ' reveal-correct';
        if(o.val === currentQuiz.selected && o.val !== q.answer) cls += ' selected-wrong';
        if(o.val === currentQuiz.selected && o.val === q.answer) cls += ' selected-correct';
      }
      return `<button class="${cls}" data-tf="${o.val}" ${locked?'disabled':''}>${o.label}</button>`;
    }).join('');
  } else if(q.type === 'fill'){
    bodyHtml = `
      <input type="text" class="fill-input" id="fill-input" placeholder="答えを入力…" ${locked?'disabled':''} value="${locked? escapeHtml(currentQuiz.selected||'') : ''}">
      ${!locked?'<button class="btn btn-primary" id="btn-submit-fill">回答する</button>':''}
    `;
  }

  let feedback = '';
  if(locked){
    const lastAns = answers[answers.length-1];
    feedback = `<div class="feedback ${lastAns.correct?'ok':'ng'}">
      ${lastAns.correct? '正解◎ ' : `不正解 → 正解: ${escapeHtml(lastAns.correctAnswer)}　`}
      ${escapeHtml(q.exp)}
    </div>`;
  }

  return `
    <div class="topbar">
      <button class="link-btn" id="btn-exit">← 中断してホームへ</button>
      <div class="q-type">${sessionLabel({level, mode:currentQuiz.mode, total:questions.length, rangeStart: currentQuiz.start!=null? currentQuiz.start+1:null, rangeEnd: currentQuiz.start!=null? currentQuiz.start+questions.length:null})} ・ ${index+1}/${questions.length}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <div class="card">
      <div class="q-cat">${level}</div>
      <div class="q-text">${escapeHtml(q.q)}</div>
      ${bodyHtml}
      ${feedback}
      ${locked?`<button class="btn btn-primary" id="btn-next" style="margin-top:10px;">${index<questions.length-1?'次の問題へ →':'結果を見る →'}</button>`:''}
    </div>
  `;
}

      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-continue">${continueButtonLabel(session)}</button>
      <button class="btn btn-ghost" id="btn-home">ホームへ</button>
    </div>
    ${renderSaveStatusNote()}
    <div class="section-title">見直し</div>
    <div class="card">
      ${session.answers.map(a=>`
        <div class="review-item">
          <div class="rq">${a.correct?'<span class="tag-ok">◎</span>':'<span class="tag-ng">×</span>'} ${escapeHtml(a.question)}</div>
          <div class="ra">${a.correct? '正解' : `あなたの回答: ${escapeHtml(String(a.userAnswer))} / 正解: ${escapeHtml(String(a.correctAnswer))}`} — ${escapeHtml(a.exp)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderHistory(){
  if(DATA.sessions.length === 0){
    return `
      <div class="topbar"><button class="link-btn" id="btn-back-home">← ホームへ</button></div>
      <div class="empty">まだ記録がありません。<br>クイズに挑戦すると、ここに履歴がたまっていきます。</div>
    `;
  }
  return `
    <div class="topbar"><button class="link-btn" id="btn-back-home">← ホームへ</button><h2 style="font-size:17px;">履歴</h2></div>
    ${DATA.sessions.map(s=>`
      <div class="hist-item" data-id="${s.id}">
        <div>
          <div class="hist-date">${fmtDate(s.date)}</div>
          <div class="hist-sub">${sessionLabel(s)}</div>
        </div>
        <div class="hist-score">${s.score}/${s.total}</div>
      </div>
    `).join('')}
  `;
}

function renderHistoryDetail(){
  const s = DATA.sessions.find(x=>x.id === historyDetailId);
  if(!s) return renderHistory();
  const pct = Math.round(s.score/s.total*100);
  return `
    <div class="topbar"><button class="link-btn" id="btn-back-history">← 履歴一覧へ</button></div>
    <div class="plate">
      <div class="eyebrow">${fmtDate(s.date)}・${sessionLabel(s)}</div>
      <div class="score-hero">
        <div class="score-num">${s.score}/${s.total}</div>
        <div class="score-label">正答率 ${pct}%</div>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-replay-session" data-session-id="${s.id}" style="margin-top:12px;">この問題をもう一度解く →</button>
    <div class="card" style="margin-top:14px;">
      ${s.answers.map(a=>`
        <div class="review-item">
          <div class="rq">${a.correct?'<span class="tag-ok">◎</span>':'<span class="tag-ng">×</span>'} ${escapeHtml(a.question)}</div>
          <div class="ra">${a.correct? '正解' : `あなたの回答: ${escapeHtml(String(a.userAnswer))} / 正解: ${escapeHtml(String(a.correctAnswer))}`} — ${escapeHtml(a.exp)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(screen === 'loading') html = '<div class="loading">開いています…</div>';
  else if(screen === 'nameGate') html = renderNameGate();
  else if(screen === 'home') html = renderHome();
  else if(screen === 'quiz') html = renderQuiz();
  else if(screen === 'result') html = renderResult();
  else if(screen === 'history') html = renderHistory();
  else if(screen === 'historyDetail') html = renderHistoryDetail();
  else if(screen === 'adminGate') html = renderAdminGate();
  else if(screen === 'adminDashboard') html = renderAdminDashboard();
  app.innerHTML = html;
  attachEvents();
}

function attachEvents(){
  const $ = sel => document.getElementById(sel);
  if(screen === 'nameGate'){
    document.querySelectorAll('[data-store]').forEach(b=>{
      b.addEventListener('click', ()=>{ pendingStore = b.getAttribute('data-store'); nameInputError=''; render(); });
    });
    $('btn-save-name') && $('btn-save-name').addEventListener('click', ()=>{
      nameInputError = '';
      saveEmployeeProfile($('name-input').value);
    });
    $('name-input') && $('name-input').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ nameInputError=''; saveEmployeeProfile(e.target.value); }
    });
  }
  if(screen === 'home'){
    document.querySelectorAll('[data-level]').forEach(b=>{
      b.addEventListener('click', ()=> startQuiz(b.getAttribute('data-level')));
    });
    $('btn-review') && $('btn-review').addEventListener('click', startReviewMode);
    $('btn-history') && $('btn-history').addEventListener('click', ()=>{ screen='history'; render(); });
    $('btn-admin') && $('btn-admin').addEventListener('click', ()=>{ adminPassInput=''; adminError=''; screen='adminGate'; render(); });
    $('btn-reset-start') && $('btn-reset-start').addEventListener('click', ()=>{ confirmingReset = true; render(); });
    $('btn-reset-confirm') && $('btn-reset-confirm').addEventListener('click', resetDevice);
    $('btn-reset-cancel') && $('btn-reset-cancel').addEventListener('click', ()=>{ confirmingReset = false; render(); });
  }
  if(screen === 'adminGate'){
    $('btn-back-home') && $('btn-back-home').addEventListener('click', ()=>{ screen='home'; render(); });
    $('btn-admin-login') && $('btn-admin-login').addEventListener('click', ()=>{
      const val = $('admin-pass-input').value;
      if(val === ADMIN_PASSCODE){ adminError=''; loadAdminDashboard(); }
      else { adminError = 'パスコードが違います'; render(); }
    });
    $('admin-pass-input') && $('admin-pass-input').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        if(e.target.value === ADMIN_PASSCODE){ adminError=''; loadAdminDashboard(); }
        else { adminError = 'パスコードが違います'; render(); }
      }
    });
  }
  if(screen === 'adminDashboard'){
    $('btn-back-home') && $('btn-back-home').addEventListener('click', ()=>{ screen='home'; render(); });
    $('btn-refresh-admin') && $('btn-refresh-admin').addEventListener('click', loadAdminDashboard);
  }
  if(screen === 'quiz'){
    $('btn-exit') && $('btn-exit').addEventListener('click', exitQuiz);
    if(!currentQuiz.locked){
      document.querySelectorAll('[data-opt]').forEach(b=>{
        b.addEventListener('click', ()=> submitAnswer(b.getAttribute('data-opt')));
      });
      document.querySelectorAll('[data-tf]').forEach(b=>{
        b.addEventListener('click', ()=> submitAnswer(b.getAttribute('data-tf') === 'true'));
      });
      $('btn-submit-fill') && $('btn-submit-fill').addEventListener('click', ()=>{
        const val = $('fill-input').value;
        if(val.trim().length===0) return;
        submitAnswer(val);
      });
      $('fill-input') && $('fill-input').addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ const val=e.target.value; if(val.trim().length>0) submitAnswer(val); }
      });
    }
    $('btn-next') && $('btn-next').addEventListener('click', nextQuestion);
  }
  if(screen === 'result'){
    $('btn-continue') && $('btn-continue').addEventListener('click', continueSession);
    $('btn-home') && $('btn-home').addEventListener('click', ()=>{ screen='home'; render(); });
  }
  if(screen === 'history'){
    $('btn-back-home') && $('btn-back-home').addEventListener('click', ()=>{ screen='home'; render(); });
    document.querySelectorAll('.hist-item').forEach(item=>{
      item.addEventListener('click', ()=>{ historyDetailId = item.getAttribute('data-id'); screen='historyDetail'; render(); });
    });
  }
  if(screen === 'historyDetail'){
    $('btn-back-history') && $('btn-back-history').addEventListener('click', ()=>{ screen='history'; render(); });
    $('btn-replay-session') && $('btn-replay-session').addEventListener('click', (e)=>{
      startReplaySession(e.target.getAttribute('data-session-id'));
    });
  }
}

loadData();
</script>
</body>
</html>
